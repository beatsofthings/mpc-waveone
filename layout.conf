[tab OSC 1]
frame x=30 y=96 w=1190 h=410 title="OSC 1 ENGINE"
enum_h cx=620 cy=148 label="ENGINE" key=osc1_mode options="WAVETABLE,GRANULAR"
enum_h cx=1000 cy=148 label="POWER" key=osc1_on options="OFF,ON"
meter cx=210 cy=300 w=192 h=192 key=position strip=assets/wavetable_3d_strip.png frames=64 when=osc1_mode:WAVETABLE
popup cx=515 cy=252 w=230 h=42 label="FACTORY WAVE" key=osc1_wave options="MORPH,SINE,SAW,SQUARE,TRIANGLE,PULSE,ORGAN" when=osc1_mode:WAVETABLE
knob cx=810 cy=300 r=42 label="WT POSITION" key=position when=osc1_mode:WAVETABLE
knob cx=1050 cy=300 r=42 label="LEVEL" key=gain

knob cx=180 cy=280 r=38 label="SIZE" key=grain_size when=osc1_mode:GRANULAR
knob cx=390 cy=280 r=38 label="DENSITY" key=grain_density when=osc1_mode:GRANULAR
knob cx=600 cy=280 r=38 label="POSITION" key=grain_position when=osc1_mode:GRANULAR
