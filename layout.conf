knob cx=600 cy=420 r=32 label="MIX" key=grain_mix when=osc1_mode:GRANULAR
qlinks "OSC 1" = osc1_mode,osc1_on,osc1_wave,position,gain,grain_size,grain_density,grain_position,grain_spray,grain_pitch,grain_reverse,grain_mix
