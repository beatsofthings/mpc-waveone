style=dark
theme_bg=#101823
theme_accent=#39D8ED
[tab OSCILLATORS]
frame x=16 y=95 w=390 h=385 title="OSC 1"
meter cx=196 cy=223 w=192 h=192 key=position strip=assets/wavetable_3d_strip.png frames=64
knob cx=112 cy=422 r=28 label="WT POS" key=position look=prophet
knob cx=290 cy=422 r=28 label="GAIN" key=gain look=prophet
enum_h cx=325 cy=146 label="OSC1" key=osc1_on options="OFF,ON"
popup cx=190 cy=475 w=220 h=30 label="FACTORY" key=osc1_wave options="MORPH,SINE,SAW,SQUARE,TRIANGLE,PULSE,ORGAN"
frame x=418 y=95 w=405 h=385 title="OSC 2"
meter cx=620 cy=223 w=192 h=192 key=osc2_position strip=assets/wavetable_3d_strip.png frames=64
knob cx=500 cy=422 r=27 label="WT POS" key=osc2_position look=prophet
knob cx=622 cy=422 r=27 label="LEVEL" key=osc2_level look=prophet
knob cx=741 cy=422 r=27 label="TUNE" key=osc2_tune look=prophet
enum_h cx=755 cy=146 label="OSC2" key=osc2_on options="OFF,ON"
popup cx=612 cy=475 w=220 h=30 label="FACTORY" key=osc2_wave options="MORPH,SINE,SAW,SQUARE,TRIANGLE,PULSE,ORGAN"
frame x=835 y=95 w=405 h=385 title="OSC 3"
meter cx=1038 cy=223 w=192 h=192 key=osc3_position strip=assets/wavetable_3d_strip.png frames=64
knob cx=920 cy=422 r=27 label="WT POS" key=osc3_position look=prophet
knob cx=1040 cy=422 r=27 label="LEVEL" key=osc3_level look=prophet
knob cx=1160 cy=422 r=27 label="TUNE" key=osc3_tune look=prophet
enum_h cx=1160 cy=146 label="OSC3" key=osc3_on options="OFF,ON"
popup cx=1030 cy=475 w=220 h=30 label="FACTORY" key=osc3_wave options="MORPH,SINE,SAW,SQUARE,TRIANGLE,PULSE,ORGAN"
qlinks "OSCILLATORS" = position,gain,osc1_on,osc2_position,osc2_level,osc2_tune,osc2_on,osc3_position,osc3_level,osc3_tune,osc3_on,osc1_wave,osc2_wave,osc3_wave
[tab FILTER]
frame x=45 y=105 w=1180 h=380 title="FILTER AND SUB"
knob cx=190 cy=270 r=58 label="CUTOFF" key=cutoff look=prophet
knob cx=455 cy=270 r=58 label="DRIVE" key=resonance look=prophet
knob cx=720 cy=270 r=58 label="SUB LEVEL" key=sub_level look=prophet
qlinks "FILTER" = cutoff,resonance,sub_level
[tab MODULATION]
frame x=45 y=105 w=1180 h=380 title="LFO 1 - PITCH"
knob cx=260 cy=270 r=58 label="RATE" key=lfo1_rate look=prophet
knob cx=570 cy=270 r=58 label="PITCH DEPTH" key=lfo1_depth look=prophet
qlinks "MODULATION" = lfo1_rate,lfo1_depth
[tab AMP ENVELOPE]
frame x=40 y=110 w=1170 h=360 title="AMPLIFIER ADSR"
knob cx=170 cy=275 r=54 label="ATTACK" key=attack look=prophet
knob cx=420 cy=275 r=54 label="DECAY" key=decay look=prophet
knob cx=670 cy=275 r=54 label="SUSTAIN" key=sustain look=prophet
knob cx=920 cy=275 r=54 label="RELEASE" key=release look=prophet
qlinks "AMP ENVELOPE" = attack,decay,sustain,release,gain
