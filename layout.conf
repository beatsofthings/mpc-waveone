[tab OSC OVERVIEW]
frame x=18 y=98 w=385 h=385 title="OSC 1"
meter cx=204 cy=264 w=192 h=192 key=position strip=assets/wavetable_3d_strip.png frames=64
enum_h cx=198 cy=150 label="POWER" key=osc1_on options="OFF,ON"
frame x=422 y=98 w=385 h=385 title="OSC 2"
meter cx=609 cy=264 w=192 h=192 key=osc2_position strip=assets/wavetable_3d_strip.png frames=64
